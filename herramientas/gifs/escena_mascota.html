<div id="pj"></div><div id="txt"></div><div id="sub">Kodama · para Claude Code</div>
<script>
  const k = Companero.crear(document.getElementById("pj"), "gatoPro", "#8fcf5f");
  const PASOS = [["reposo", "Te acompaña mientras trabajas", null], ["trabajando", "Tu chat está trabajando…", null],
                 ["escribio", "¡Terminó! Te avisa", "termino"], ["escribio", "Te pregunta algo", "pregunta"], ["enviado", "Respondes y sigue", null]];
  let i = 0; const T = document.getElementById("txt");
  function paso() { const [e, txt, ins] = PASOS[i % PASOS.length]; T.style.opacity = 0;
    setTimeout(() => { T.textContent = txt; T.style.opacity = 1; }, 250); k.ir(e); k.insignia(ins); i++; }
  paso(); setInterval(paso, 2200);
</script>
